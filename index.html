<html>
  <head>
    <title>music player by Kyle Nham</title>
    <link id="favicon" rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="mstyles.css">
  </head>
  <body>
    <image crossorigin="anonymous" id="bg-image"></image>
    <video playsinline poster muted id="bg-video"></video>
    <audio crossorigin="anonymous" id="audio"></audio>

    <div id="visualizer">
      
    </div>

    <div id="playlist">
      <div id="song-selection"></div>
      <div id="settings">
        <input type="file" accept="audio/* video/*" id="file-selector" multiple>

        <div id="playback">
          <label for="playback-speed">Playback Speed:</label>
          <input id="playback-speed" type="range" min="0.5" max="2" step="0.05" value="1" list="playback-speed-datalist">
          <datalist id="playback-speed-datalist">
            <option value="0.5"></option>
            <option value="0.75"></option>
            <option value="1"></option>
            <option value="1.25"></option>
            <option value="1.5"></option>
            <option value="1.75"></option>
            <option value="2"></option>
          </datalist>
        </div>

        <div id="reverb">
          <div>
            <label for="wet-gain">Wet:</label>
            <input id="wet-gain" type="range" min="0" max="1" step="0.01" value="0" list="reverb-datalist">
          </div>
          <div>
            <label for="dry-gain">Dry:</label>
            <input id="dry-gain" type="range" min="0" max="1" step="0.01" value="1" list="reverb-datalist">
          </div>

          <label>Reverb</label>

          <datalist id="reverb-datalist">
            <option value="0"></option>
            <option value="0.25"></option>
            <option value="0.5"></option>
            <option value="0.75"></option>
            <option value="1"></option>
          </datalist>
        </div>

        <div id="eq">
          <div>
            <label for="low-gain">500hz</label>
            <input id="low-gain" type="range" min="-12" max="12" step="0.1" value="0" list="eq-datalist">
          </div>
          <div>
            <label for="mid-gain">1500hz</label>
            <input id="mid-gain" type="range" min="-12" max="12" step="0.1" value="0" list="eq-datalist">
          </div>
          <div>
            <label for="high-gain">3000hz</label>
            <input id="high-gain" type="range" min="-12" max="12" step="0.1" value="0" list="eq-datalist">
          </div>

          <label>Equalizer</label>

          <datalist id="eq-datalist">
            <option value="-12"></option>
            <option value="-6"></option>
            <option value="0"></option>
            <option value="6"></option>
            <option value="12"></option>
          </datalist>
        </div>
      </div>
    </div>

    <div id="player">
      <image id="cover" src="assets/default.png"></image>

      <h1><span id="name">no audio selected</span></h1>

      <div id="audio-controls">
        <span><img id="prev" src="assets/back.svg"></span>
        <span><img id="play-pause" src="assets/play.svg"></span>
        <span><img id="skip" src="assets/next.svg"></span>
        <span><img id="loop" src="assets/loop0.svg"></span>
        <span><img id="shuffle" src="assets/shuffle0.svg"></span>
      </div>

      <div id="volume">
        <input type="range" min="0" max="1" step="0.01" value="1">
      </div>
    </div>

    <div id="progress-bar">
      <div id="pb-fill"></div>
      <h3 id="pb-text"></h3>
    </div>

    <script src="libs/averagecolor.js"></script>
    <script src="libs/jsmediatags.js"></script>
    <script src="libs/reverb.js"></script>
    <script src="db.js"></script>
    <script src="mscript.js"></script>
  </body>
</html>
